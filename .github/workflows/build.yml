name: Build Tweak

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Extract SDK
      run: |
        if [ -f "SDK.zip" ]; then
          unzip SDK.zip -d SDK
        fi

    - name: Setup Theos
      uses: unforgiven-dev/install-theos@master

    - name: Make Package
      run: make package
