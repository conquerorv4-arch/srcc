      - name: Extract SDK
        run: |
          echo "=== Arxiv tam açılır ==="
          rm -rf SDK temp_sdk
          mkdir -p temp_sdk
          unzip -q SDK.zip -d temp_sdk
          
          # Əgər zip-in içində birbaşa SDK qovluğu varsa
          if [ -d "temp_sdk/SDK" ]; then
            cp -r temp_sdk/SDK SDK
          else
            # Əgər birbaşa fayllardırsa, özümüz SDK qovluğu yaradıb içərisinə atırıq
            mkdir -p SDK
            cp -r temp_sdk/* SDK/
          fi
          
          rm -rf temp_sdk
          echo "=== SDK qovluğunun strukturu ==="
          ls -la SDK/
