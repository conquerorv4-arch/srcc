      - name: Extract SDK
        run: |
          echo "=== Arxiv açılır ==="
          rm -rf SDK temp_sdk
          mkdir -p temp_sdk
          unzip -q SDK.zip -d temp_sdk
          
          mkdir -p SDK
          
          # Zip-in içindən çıxan bütün .hpp fayllarını və ya qovluqları axtarıb SDK qovluğuna yığırıq
          find temp_sdk -name "*.hpp" -exec cp {} SDK/ \;
          
          # Əgər zip-in içində artıq SDK alt qovluğu varsa, onu da birbaşa köçürürük
          if [ -d "temp_sdk/SDK" ]; then
            cp -r temp_sdk/SDK/* SDK/
          fi
          
          # Həmçinin tapıla biləcək digər qovluq strukturlarını da yoxlayırıق
          for d in temp_sdk/*/; do
            if [ -d "$d" ]; then
              cp -r "$d"* SDK/ 2>/dev/null || true
            fi
          done
          
          rm -rf temp_sdk
          
          echo "=== SDK qovluğunun son tərkibi ==="
          ls -la SDK/
