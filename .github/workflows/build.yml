    - name: Extract SDK
      run: |
        echo "=== Zip faylı açılır ==="
        rm -rf SDK
        mkdir -p SDK
        unzip -q SDK.zip -d SDK
        
        # Əgər zip-in içindən yenə SDK adlı alt qovluq çıxıbsa, strukturu düzəldirik
        if [ -d "SDK/SDK" ]; then
          mv SDK/SDK/* SDK/
          rmdir SDK/SDK
        fi
        
        echo "=== SDK qovluğunun tərkibi ==="
        ls -la SDK/
