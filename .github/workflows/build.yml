    - name: Extract SDK
      run: |
        echo "=== Directory contents before extraction ==="
        ls -la
        
        if [ -f "SDK.zip" ]; then
          rm -rf temp_sdk SDK
          mkdir -p temp_sdk
          unzip -q SDK.zip -d temp_sdk
          
          # Əgər zip-in içində birbaşa .hpp faylları varsa
          if ls temp_sdk/*.hpp 1> /dev/null 2>&1; then
            mkdir -p SDK
            cp temp_sdk/* SDK/
          # Əgər zip-in içində SDK qovluğu varsa
          elif [ -d "temp_sdk/SDK" ]; then
            cp -r temp_sdk/SDK SDK
          else
            # Digər hallarda tapılan ilk qovluğu SDK olaraق götürək
            FIRST_DIR=$(find temp_sdk -mindepth 1 -maxdepth 1 -type d | head -n 1)
            if [ -n "$FIRST_DIR" ]; then
              cp -r "$FIRST_DIR" SDK
            else
              mkdir -p SDK
              cp -r temp_sdk/* SDK/
            fi
          fi
          rm -rf temp_sdk
        fi
        
        echo "=== Directory contents of SDK/ ==="
        ls -la SDK/
