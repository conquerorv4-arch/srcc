name: Build Tweak

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Extract SDK
        run: |
          rm -rf SDK temp_sdk
          mkdir -p temp_sdk
          unzip -q SDK.zip -d temp_sdk
          if [ -d "temp_sdk/SDK" ]; then
            cp -r temp_sdk/SDK SDK
          else
            mkdir -p SDK
            cp -r temp_sdk/* SDK/
          fi
          rm -rf temp_sdk

          echo "===== SDK KÖK ====="
          ls -la SDK/
          echo "===== ARANAN HEADER ====="
          find . -name "SHANKS_PUBGM_Basic.hpp" 2>/dev/null || echo "TAPILMADI"
          echo "===== TÜM .hpp DOSYALARI ====="
          find SDK -name "*.hpp" | head -50
          echo "===== SDK KLASÖRLERİ ====="
          find SDK -maxdepth 3 -type d | head -50

      - name: Setup Theos Manually
        run: |
          brew install ldid make dpkg
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          git clone https://github.com/theos/sdks.git ~/theos-sdks
          mkdir -p /opt/theos/sdks
          cp -r ~/theos-sdks/*.sdk /opt/theos/sdks/ 2>/dev/null || true

      - name: Make Package
        run: |
          export THEOS=/opt/theos
          make package
