name: Build Tweak

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Extract SDK
      run: |
        echo "=== Directory contents before extraction ==="
        ls -la
        
        if [ -f "SDK.zip" ]; then
          rm -rf temp_sdk SDK
          mkdir -p temp_sdk
          unzip -q SDK.zip -d temp_sdk
          
          if ls temp_sdk/*.hpp 1> /dev/null 2>&1; then
            mkdir -p SDK
            cp temp_sdk/* SDK/
          elif [ -d "temp_sdk/SDK" ]; then
            cp -r temp_sdk/SDK SDK
          else
            FIRST_DIR=$(find temp_sdk -mindepth 1 -maxdepth 1 -type d | head -n 1)
            if [ -n "$FIRST_DIR" ]; then
              cp -r "$FIRST_DIR" SDK
            else
              mkdir -p SDK
              cp -r temp_sdk/* SDK/
            fi
          fi
          rm -rf temp_sdk
        fi
        
        echo "=== Directory contents of SDK/ ==="
        ls -la SDK/

    - name: Setup Theos Manually
      run: |
        brew install ldid make dpkg
        git clone --recursive https://github.com/theos/theos.git ~/theos
        sudo mkdir -p /opt/theos
        sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
        git clone https://github.com/theos/sdks.git ~/theos-sdks
        cp -r ~/theos-sdks/*.sdk /opt/theos/sdks/ 2>/dev/null || true

    - name: Make Package
      run: |
        export THEOS=/opt/theos
        make package
