      - name: Extract SDK
        run: |
          echo "=== SDK arxivi açılır ==="
          rm -rf SDK temp_sdk
          mkdir -p temp_sdk
          unzip -q SDK.zip -d temp_sdk
          
          mkdir -p SDK
          
          # Əgər zip-in içində birbaşa .hpp faylları və ya qovluqlar varsa, hamısını SDK qovluğuna köçürürük
          if [ -d "temp_sdk/SDK" ]; then
            cp -r temp_sdk/SDK/* SDK/
          else
            cp -r temp_sdk/* SDK/
          fi
          
          rm -rf temp_sdk
          
          echo "=== SDK qovluğunun son strukturu ==="
          ls -la SDK/
          ls -la SDK/SDK/ || true
