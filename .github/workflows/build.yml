name: Build iOS Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        # Əgər SDK lazımdırsa, burda SDK-nı theos/sdks qovluğuna kopyalaya bilərsən

    - name: Compile Tweak
      env:
        THEOS: ${{ github.workspace }}/theos # və ya $HOME/theos
      run: |
        make package

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: compiled-tweak
        path: packages/*.deb
