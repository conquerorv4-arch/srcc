      - name: Extract SDK
        run: |
          echo "=== Zip faylının tərkibi ==="
          unzip -l SDK.zip
          
          echo "=== Fayllar açılır ==="
          rm -rf SDK
          mkdir -p SDK
          unzip -q SDK.zip -d SDK
          
          # Əgər zip-in içində qovluq varsa, düzgün yerə gətirək
          if [ -d "SDK/SDK" ]; then
            mv SDK/SDK/* SDK/
            rmdir SDK/SDK
          fi
          
          echo "=== SDK qovluğunun son tərkibi ==="
          ls -la SDK/
