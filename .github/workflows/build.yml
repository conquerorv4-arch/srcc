name: Build Tweak

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Extract SDK
      run: |
        if [ -f "SDK.zip" ]; then
          unzip SDK.zip -d SDK
        fi

    - name: Setup Theos Manually
      run: |
        # Theos üçün lazım olan ləvazimatları quraşdıraq (brew vasitəsilə ldid, xz və s.)
        brew install ldid make dpkg
        
        # Theos-u qovluğa klonlayaq
        git clone --recursive https://github.com/theos/theos.git ~/theos
        
        # Theos SDK-larını əlavə edək (iPhoneOS SDK)
        sudo mkdir -p /opt/theos
        sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
        
        # İOS SDK-nı yükləyək (Theos SDK-ları üçün)
        git clone https://github.com/theos/sdks.git ~/theos-sdks
        cp -r ~/theos-sdks/*.sdk /opt/theos/sdks/ 2>/dev/null || true

    - name: Make Package
      run: |
        export THEOS=/opt/theos
        make package
