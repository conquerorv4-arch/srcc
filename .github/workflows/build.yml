name: Build Tweak

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Extract SDK
      run: |
        ls -la
        if [ -f "SDK.zip" ]; then
          mkdir -p temp_sdk
          unzip SDK.zip -d temp_sdk
          mkdir -p SDK
          cp -r temp_sdk/* SDK/ || true
          if [ -d "temp_sdk/SDK" ]; then
            cp -r temp_sdk/SDK/* SDK/ || true
          fi
        fi
        ls -la SDK/

    - name: Setup Theos Manually
      run: |
        brew install ldid make dpkg
        git clone --recursive https://github.com/theos/theos.git ~/theos
        sudo mkdir -p /opt/theos
        sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
        git clone https://github.com/theos/sdks.git ~/theos-sdks
        cp -r ~/theos-sdks/*.sdk /opt/theos/sdks/ 2>/dev/null || true

    - name: Make Package
      run: |
        export THEOS=/opt/theos
        make package
